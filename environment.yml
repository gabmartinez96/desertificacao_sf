name: geo
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11

  # core
  - numpy
  - pandas
  - scipy
  - xarray
  - dask
  - zarr

  # geo
  - rasterio
  - rioxarray
  - geopandas
  - shapely
  - pyproj
  - pyogrio

  # netcdf/hdf
  - netcdf4
  - h5py
  - cftime

  # earth engine
  - geemap
  - earthengine-api
  - xee

  # optional grib
  - cfgrib
  - eccodes

